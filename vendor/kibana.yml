# Kibana Server ---------------------------------------------------------------
server:
  host: ${KIBANA_HOST:0.0.0.0}
  port: ${PORT:5601}
  name: ${CONTAINER:my-kibana}

# Elasticsearch Database ------------------------------------------------------
elasticsearch:
  hosts:
    - ${ELASTICSEARCH_HOST:http://localhost:9200}
  username: ${ELASTICSEARCH_USERNAME:kibana_system}
  password: ${ELASTICSEARCH_PASSWORD:pass}
  ssl:
    verificationMode: ${ELASTICSEARCH_SSL_VERIFICATIONMODE:full}
    # Optional PEM CA file path. Unset or empty uses the default trusted CAs.
    certificateAuthorities: ${ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES:}

# Log -------------------------------------------------------------------------
logging:
  root:
    level: ${KIBANA_LOG_LEVEL:debug}

# End of Scalingo provided configuration --------------------------------------
